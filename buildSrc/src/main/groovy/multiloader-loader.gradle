import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-common'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named("sourcesJar", Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = "${System.getenv('CURSEFORGE_KEY')}"
    debugMode = true
    def projectId = "${project.cf_id}".toString()
    def artifactName = "${base.archivesName.get()}-${project.version}"
    def artifactPath = "${project.layout.buildDirectory.get()}/libs"
    def mainFile = upload(projectId, file("${artifactPath}/${artifactName}.jar"))
    file(artifactPath).listFiles({ File file ->
        !file.name.contentEquals("${artifactName}.jar") && file.name.startsWith(artifactName)
    } as FileFilter).each {
        mainFile.withAdditionalFile(it)
    }
    mainFile.changelogType = 'markdown'
    mainFile.changelog = getRootProject().file('CHANGELOG_LATEST.md')
    mainFile.releaseType = "${project.release_type}"
    "${project.release_versions}".split(',').each {
        mainFile.addGameVersion("${it}")
    }
    mainFile.addEnvironment("Client")
    mainFile.addEnvironment("Server")

    doLast {

        if (project.hasProperty('cf_page') && mainFile.curseFileId != null) {
            project.ext.curse_link = "${project.findProperty('cf_page')}/files/${mainFile.curseFileId}"
        }
    }
}

modrinth {
    token = "${System.getenv('MODRINTH_KEY')}" ?: ""
    debugMode = true
    projectId = "${project.modrinth_id}"
    def artifactName = "${base.archivesName.get()}-${project.version}"
    versionName = artifactName
    versionType = "${project.release_type}"
    changelog = getRootProject().file('CHANGELOG_LATEST.md').text
    def artifactPath = "${project.layout.buildDirectory.get()}/libs"
    uploadFile = file("${artifactPath}/${artifactName}.jar")
    def secondaryFiles = file(artifactPath).listFiles({ File file ->
        !file.name.contentEquals("${artifactName}.jar") && file.name.startsWith(artifactName)
    } as FileFilter)
    additionalFiles = secondaryFiles != null ? secondaryFiles.toList() : []
    gameVersions = "${project.release_versions}".split(",") as List<String>
}

tasks.modrinth.doLast {

    if (project.hasProperty('modrinth_page') && tasks.modrinth.newVersion != null) {
        project.ext.modrinth_link = "${project.findProperty('modrinth_page')}/version/${tasks.modrinth.newVersion.id}"
    }
}
